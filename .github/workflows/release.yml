name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Decode release keystore (optional secrets)
        env:
          PA_KS_BASE64: ${{ secrets.PA_KS_BASE64 }}
          PA_KS_PASS: ${{ secrets.PA_KS_PASS }}
          PA_KEY_PASS: ${{ secrets.PA_KEY_PASS }}
        run: |
          if [ -n "$PA_KS_BASE64" ]; then
            echo "$PA_KS_BASE64" | base64 -d > release.keystore
            echo "PA_RELEASE_STORE=release.keystore" >> "$GITHUB_ENV"
            echo "PA_RELEASE_STORE_PASS=$PA_KS_PASS" >> "$GITHUB_ENV"
            echo "PA_RELEASE_KEY_ALIAS=phone-agent" >> "$GITHUB_ENV"
            echo "PA_RELEASE_KEY_PASS=$PA_KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "no PA_KS_BASE64 secret — release APK falls back to debug signing"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node (for npm pack)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install NDK (for node-pty cross-compile)
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"
          ls -d "$ANDROID_HOME"/ndk/*/ || true

      - name: Stage embedded runtime (Node.js from Termux repo)
        run: bash scripts/fetch-runtime.sh

      - name: Cross-compile node-pty for android-arm64
        run: bash scripts/fetch-native.sh

      - name: Compile landlock-wrap (sandbox tier 1, probe-gated at runtime)
        run: |
          CC="$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          mkdir -p app/src/main/assets/native
          "$CC" -O2 -Wall -Werror scripts/landlock-wrap.c -o app/src/main/assets/native/landlock-wrap

      - name: Stage CLI packages (zcode / dsh)
        run: bash scripts/fetch-packages.sh

      - name: Stage codex + claude binaries (terminal picker)
        run: bash scripts/fetch-terminal-extra.sh

      - name: Build official ZCode web UI + server
        run: bash scripts/fetch-zcode-web.sh

      - name: Build release APK (release-signed when PA_KS_BASE64 is set; debug-signed fallback)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle :app:assembleRelease --no-daemon -Pandroid.suppressUnsupportedCompileSdk=35

      - name: Rename APK with tag
        run: cp app/build/outputs/apk/release/app-release.apk "phone-agent-${GITHUB_REF_NAME}-arm64.apk"

      - name: Show APK signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "phone-agent-${GITHUB_REF_NAME}-arm64.apk" | head -4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: phone-agent-*-arm64.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
