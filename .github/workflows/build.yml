name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node (for npm pack)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Accept SDK licenses
        # ubuntu-22.04 runners ship a preinstalled Android SDK at $ANDROID_HOME;
        # AGP auto-installs missing platforms/build-tools/NDK once licenses are accepted.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Stage embedded runtime (Node.js from Termux repo)
        run: bash scripts/fetch-runtime.sh

      - name: Stage CLI packages (zcode / dsh)
        run: bash scripts/fetch-packages.sh

      - name: Build debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Phone-Agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload staged assets (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: staged-assets
          path: |
            app/src/main/assets/runtime.version
            app/src/main/assets/packages/
          if-no-files-found: ignore
